<style>

:root{--ink:#111111;--paper:#F7F6F2;--white:#fff;--pink:#FF2D7A;--pink-soft:#FFE7EF;
--pink-ink:#B01050;--grey:#6E6E6E;--line:#E6E6E6;--sun:#FFF3D6;
--h:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;--b:'Inter',system-ui,-apple-system,sans-serif;--wrap:1160px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--b);color:var(--ink);background:var(--white);line-height:1.6;
-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--h);letter-spacing:-.025em;line-height:1.1;overflow-wrap:break-word}
h1{font-size:clamp(36px,7.5vw,66px);font-weight:800}
h2{font-size:clamp(27px,5vw,42px);font-weight:800}
h3{font-size:clamp(18px,3.6vw,21px);font-weight:700}
p{color:#444;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}
.pink{color:var(--pink)}.muted{color:var(--grey)}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.lead{font-size:clamp(16px,3.6vw,19px);color:#444}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;
font-family:var(--b);font-weight:700;font-size:16px;padding:17px 30px;border-radius:14px;
transition:transform .15s,background .15s;min-height:56px;text-align:center}
.btn:active{transform:scale(.98)}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(255,45,122,.28)}
.btn-pink:hover{background:#EE1E6C}
.btn-ink{background:var(--ink);color:#fff}
.btn-white{background:#fff;color:var(--ink)}
.btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:12px 20px;font-size:15px;min-height:46px;border-radius:11px}
.btnrow{display:flex;flex-wrap:wrap;gap:12px}
.btnrow>.btn{margin:0 12px 12px 0}

header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);
border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;height:76px}
.logo{display:flex;align-items:center;font-family:var(--h);font-weight:800;font-size:19px;letter-spacing:.12em}
.logo img{width:31px;height:31px;margin-right:10px}
.logo .wm{display:inline}
.logo .d{margin-left:-.02em}
.navlinks{display:flex;margin-left:44px;font-size:15.5px;font-weight:600}
.navlinks a{padding:0 15px}
.navlinks a:hover{color:var(--pink)}
.navcta{display:flex;margin-left:auto}
.navcta .btn{margin-left:10px}
.burger{display:none;margin-left:auto;background:none;border:0;cursor:pointer;padding:11px;min-width:46px;min-height:46px}
.burger span{display:block;width:24px;height:2.5px;background:var(--ink);border-radius:2px;position:relative}
.burger span::before,.burger span::after{content:'';position:absolute;left:0;width:24px;height:2.5px;background:var(--ink);border-radius:2px}
.burger span::before{top:-8px}.burger span::after{top:8px}
.drawer{display:none;position:fixed;inset:76px 0 0;background:#fff;z-index:55;padding:26px 20px;overflow-y:auto}
.drawer.open{display:block}
.drawer a{display:block;padding:18px 0;font-size:19px;font-family:var(--h);font-weight:700;border-bottom:1px solid var(--line)}
.drawer .btn{margin-top:20px;width:100%}

section{padding:clamp(52px,8vw,92px) 0}
.tint{background:var(--paper)}
.sec-head{max-width:680px;margin:0 auto clamp(30px,5vw,48px);text-align:center}
.sec-head.left{margin-left:0;text-align:left}
.sec-head h2{margin:14px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,28px)}
.card.soft{background:var(--paper);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:20px;margin:0 -10px}
.row>*{margin:0 10px 20px;min-width:0}
.c2>*{flex:1 1 360px}.c3>*{flex:1 1 280px}.c4>*{flex:1 1 210px}
.flexrow{display:flex;gap:14px;align-items:flex-start;min-width:0}
.flexrow>.grow{flex:1 1 auto;min-width:0}
.flexrow>.fix{flex:0 0 auto;text-align:right;white-space:nowrap}

/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(34px,6vw,76px) 0 clamp(40px,6vw,80px)}
.hero::before{content:'';position:absolute;top:-240px;right:-180px;width:640px;height:640px;
border-radius:50%;background:radial-gradient(circle,#FFE7EF 0%,rgba(255,231,239,0) 70%);z-index:0}
.hero .wrap{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--pink-soft);color:var(--pink-ink);
font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px}

/* category tiles */
/* A grid, not flex wrap. Eight cards in a flex row leave the last two at a different width to the first six, which reads as a mistake. */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0}
@media(max-width:900px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.cats{grid-template-columns:1fr}}
.cat{background:#fff;border:1px solid var(--line);border-radius:18px;
padding:20px 18px;transition:.16s;min-width:0;overflow-wrap:normal;word-break:normal}
.cat h4,.cat strong{overflow-wrap:normal;word-break:keep-all;hyphens:none}
.cat:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 10px 26px rgba(17,17,17,.07)}
.cat .ic{width:44px;height:44px;border-radius:13px;background:var(--pink-soft);display:flex;
align-items:center;justify-content:center;margin-bottom:14px}
.cat h4{font-size:15.5px;font-weight:700}
.cat p{font-size:15px;color:var(--grey);margin-top:0px}

/* numbered steps */
.step{position:relative;padding-left:0}
.step .num{width:52px;height:52px;border-radius:16px;background:var(--ink);color:#fff;
display:flex;align-items:center;justify-content:center;font-family:var(--h);font-weight:800;font-size:19px;margin-bottom:14px}
.step:nth-child(2) .num{background:var(--pink)}
.step:nth-child(3) .num{background:var(--ink)}
.step:nth-child(4) .num{background:var(--pink)}

/* stats band */
.band{background:var(--ink);color:#fff;border-radius:28px;padding:clamp(30px,5vw,54px);text-align:center}
.band h2,.band h3{color:#fff}.band p{color:#B9B9B9}
.stat{font-family:var(--h);font-size:clamp(30px,6vw,46px);font-weight:800;color:var(--pink);line-height:1}

/* phone mock */
.phone{background:var(--ink);border-radius:34px;padding:14px;max-width:300px;margin:0 auto;
box-shadow:0 28px 60px rgba(17,17,17,.22)}
.screen{background:var(--paper);border-radius:24px;padding:20px 18px}
.bar{height:7px;background:#EDECE8;border-radius:99px;overflow:hidden;margin:14px 0}
.bar span{display:block;height:100%;background:var(--pink);border-radius:99px}

/* compare cards */
.prov{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);min-width:0}
.prov:first-of-type{border-top:0}
.tag{display:inline-block;background:var(--pink);color:#fff;font-size:15px;font-weight:800;
letter-spacing:.05em;padding:4px 9px;border-radius:999px;text-transform:uppercase}
.tag.alt{background:var(--ink)}

/* legal */
.legal{max-width:820px;padding:clamp(32px,6vw,54px) 0 90px}
.legal h2{font-size:clamp(20px,4vw,25px);margin:38px 0 12px}
.legal h3{font-size:17px;margin:24px 0 9px}
.legal p,.legal li{font-size:15.5px;color:#333;margin-bottom:14px}
.legal ul,.legal ol{margin:0 0 16px 20px}.legal li{margin-bottom:6px}
.legal .updated{font-size:15px;color:var(--grey);padding:16px 18px;background:var(--paper);border-radius:14px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0}
.legal table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:460px}
.legal th,.legal td{border:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:top}
.legal th{background:var(--paper);font-family:var(--h);font-weight:700}
.toc{background:var(--paper);border-radius:16px;padding:20px 22px;margin:24px 0 10px}
.toc a{display:block;padding:5px 0;font-size:14.5px}
.toc a:hover{color:var(--pink)}
.note{background:var(--pink-soft);border-radius:14px;padding:17px 19px;margin:20px 0}
.note b{color:var(--pink-ink)}
.faq{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.faq summary{padding:19px 22px;cursor:pointer;font-family:var(--h);font-weight:700;font-size:16.5px;

/* ---------------- motion ---------------- */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}
.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}
.card,.cat{transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(17,17,17,.08)}
.bar span{transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.grow-in{animation:growIn .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes growIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);display:inline-block;
margin-right:8px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}

/* ---------------- the interactive demo ---------------- */
.demo{display:flex;flex-wrap:wrap;gap:26px;align-items:center;margin:0 -13px}
.demo>*{margin:0 13px;min-width:0}
.demo-steps{flex:1 1 320px}
.demo-phone{flex:0 1 320px}
.dstep{display:flex;gap:14px;padding:16px;border-radius:16px;cursor:pointer;border:1px solid transparent;
transition:background .25s,border-color .25s}
.dstep:hover{background:var(--paper)}
.dstep.on{background:#fff;border-color:var(--line);box-shadow:0 10px 30px rgba(17,17,17,.06)}
.dstep .dn{flex:none;width:34px;height:34px;border-radius:11px;background:var(--paper);color:var(--grey);
display:flex;align-items:center;justify-content:center;font-family:var(--h);font-weight:800;font-size:15px;
transition:background .25s,color .25s}
.dstep.on .dn{background:var(--pink);color:#fff}
.dstep h4{font-size:16px;margin-bottom:0px}
.dstep p{font-size:13.5px;color:var(--grey)}
.dstep.on p{color:#444}
.screen-swap{animation:swap .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.progress-track{height:3px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.progress-track i{display:block;height:100%;background:var(--pink);width:0}
.dstep.on .progress-track i{animation:tick 6s linear both}
@keyframes tick{from{width:0}to{width:100%}}

@media(prefers-reduced-motion:reduce){
 .reveal{opacity:1;transform:none;transition:none}
 .float,.pulse-dot,.grow-in,.screen-swap{animation:none}
 .dstep.on .progress-track i{animation:none;width:100%}
}

@media(max-width:900px){
 .navlinks,.navcta{display:none}

<script>
/* If the library fails to load, say so rather than leaving a form that
   silently does nothing when pressed. */
if (typeof supabase === 'undefined') {
  document.getElementById('form').style.display = 'none';
  document.getElementById('intro').textContent =

}

const SUPABASE_URL = 'https://qtinsaijwehqjbhoufau.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0aW5zYWlqd2VocWpiaG91ZmF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDIwODYsImV4cCI6MjEwMjExODA4Nn0.d4qeCAzYOPYbCQrvHBtlK12qn_FfsKnDPETT9wzdGbE';
const sb = (typeof supabase === 'undefined') ? null : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: true, flowType: 'pkce' }
});

function say(t, ok) {
  var m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'msg ' + (ok ? 'ok' : 'bad');
}

/* A reset link carries a session in the URL. If it is missing or expired the
   person needs a fresh link, and saying so is more useful than a silent form. */
(async function () {
  if (!sb) return;
  try {
    var res = await sb.auth.getSession();
    if (!res.data.session) {
      document.getElementById('form').style.display = 'none';
      document.getElementById('intro').textContent =
        'This link has expired or has already been used. Open the app, tap I forgot my password, and we will send a new one.';
    }
  } catch (e) {
    document.getElementById('intro').textContent =
      'Something went wrong opening this link. Try requesting a new one from the app.';
  }
})();

async function setPassword() {
  if (!sb) return say('This page could not load properly. Refresh and try again.', false);
  var a = document.getElementById('p1').value;
  var b = document.getElementById('p2').value;
  if (a.length < 8) return say('Use at least eight characters.', false);
  if (a !== b) return say('Those two do not match.', false);

  var btn = document.getElementById('save');
  btn.disabled = true; btn.textContent = 'Saving';
  try {
    var r = await sb.auth.updateUser({ password: a });
    if (r.error) throw r.error;
    document.getElementById('form').style.display = 'none';
    document.getElementById('intro').textContent =
      'Done. Your password is changed. Open the app and sign in with it.';
  } catch (e) {
    say(e.message || 'Could not save that. Try requesting a new link.', false);
    btn.disabled = false; btn.textContent = 'Save the new password';
  }
}
